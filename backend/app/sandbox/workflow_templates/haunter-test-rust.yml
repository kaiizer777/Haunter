name: haunter-test-rust
on:
  push:
    branches: ["sandbox/**", "haunter-flake-check-**"]
  workflow_dispatch:

permissions:
  contents: read

# No secrets. No push. No deploy. By design.
env:
  # Monorepo scoping. The server rewrites these two quoted literals from
  # RepoSettings.working_dir / RepoSettings.test_command before pushing the
  # workflow to the mirror (see render_workflow_content). The defaults below
  # mean "repo root" and "language-default test command".
  # tests/test_sandbox_lang_packs.py asserts every template keeps both markers,
  # so template drift fails CI instead of silently ignoring a user's scope.
  HAUNTER_WORKING_DIR: "."
  HAUNTER_TEST_COMMAND: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        # ubuntu-latest ships rustup with a stable toolchain preinstalled, and
        # rustup honours a committed rust-toolchain[.toml] on first use — so no
        # third-party toolchain action (and no unpinned action ref) is needed.
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Glob from the repo root, so a monorepo crate in a subdirectory is
          # still covered by HAUNTER_WORKING_DIR.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint (clippy, best-effort)
        run: |
          cd "${HAUNTER_WORKING_DIR:-.}"
          cargo clippy --all-targets -- -D warnings || echo "::warning::clippy found issues"
        continue-on-error: true

      - name: Run tests
        run: |
          # A missing HAUNTER_WORKING_DIR aborts here: the runner invokes bash
          # with `-e`, so a failing `cd` fails the step instead of testing root.
          cd "${HAUNTER_WORKING_DIR:-.}"
          if [ -n "${HAUNTER_TEST_COMMAND}" ]; then
            echo "::notice::running RepoSettings.test_command"
            eval "${HAUNTER_TEST_COMMAND}"
            exit $?
          fi
          if [ ! -f Cargo.toml ]; then
            echo "::error::no Cargo.toml under ${HAUNTER_WORKING_DIR:-.} — cannot run cargo test"
            exit 1
          fi
          if [ -f Cargo.lock ]; then
            cargo test --locked || cargo test
          else
            cargo test
          fi

      - name: Build (best-effort)
        run: |
          cd "${HAUNTER_WORKING_DIR:-.}"
          cargo build || echo "::warning::cargo build found issues"
        continue-on-error: true