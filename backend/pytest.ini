[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    db: requires a real PostgreSQL database (set TEST_DATABASE_URL). Run with `-m db`, or exclude with `-m "not db"` for the hermetic suite. No addopts are set on purpose: CI has Postgres, so the default run must still include these.
