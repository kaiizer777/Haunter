name: haunter-test-py
on:
  push:
    branches: [haunter-attempt-*]
  workflow_dispatch:

# No secrets. No env. No deploy. By design.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Always install pytest — required regardless of requirements.txt presence.
          pip install -q pytest
          if [ -f requirements.txt ]; then
            python -m pip install -q -r requirements.txt
          elif [ -f Pipfile ]; then
            pip install -q pipenv && pipenv install --dev --system --ignore-pipfile 2>/dev/null || true
          fi

      - name: Lint (ruff, best-effort)
        run: |
          if command -v ruff >/dev/null 2>&1 || python -m pip install -q ruff; then
            python -m ruff check . || echo "::warning::ruff found issues"
          else
            echo "ruff not available — skipping"
          fi
        continue-on-error: true

      - name: Type check (mypy, best-effort)
        run: |
          if grep -q "mypy" requirements.txt dev-requirements.txt 2>/dev/null; then
            python -m mypy . || echo "::warning::mypy found issues"
          else
            echo "mypy not configured — skipping"
          fi
        continue-on-error: true

      - name: Run tests
        run: |
          # Priority 1: standard config file at root → let pytest auto-discover.
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || [ -f setup.cfg ]; then
            python -m pytest -q --tb=short --maxfail=10
          # Priority 2: tests/ or test/ directory → run explicitly.
          elif [ -d tests ] || [ -d test ]; then
            TESTDIR=$([ -d tests ] && echo tests || echo test)
            python -m pytest "$TESTDIR" -q --tb=short --maxfail=10
          # Priority 3: root-level test_*.py or *_test.py files.
          elif ls test_*.py *_test.py 2>/dev/null | grep -q .; then
            python -m pytest . -q --tb=short --maxfail=10
          else
            echo "No tests found — skipping"
            # exit 0: an empty sandbox is not a test failure; Haunter treats
            # "no tests" as a neutral signal so the fix is not falsely rejected.
            exit 0
          fi

      - name: Build (best-effort)
        run: |
          if [ -f pyproject.toml ] && grep -q "build-system" pyproject.toml; then
            python -m pip install -q build && python -m build
          else
            echo "No build config — skipping"
          fi
        continue-on-error: true
