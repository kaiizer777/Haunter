[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
timeout = 120
markers =
    fast: Hermetic unit/logic tests with zero external I/O (runs in default fast suite).
    db: Tests requiring a real PostgreSQL database (set TEST_DATABASE_URL).
    slow: Long-running E2E tests, retry backoffs, or multi-turn simulation.
    eval: 20-case golden benchmark eval harness.
