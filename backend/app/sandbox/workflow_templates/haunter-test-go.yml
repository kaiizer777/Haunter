name: haunter-test-go
on:
  push:
    branches: ["sandbox/**", "haunter-flake-check-**"]
  workflow_dispatch:

permissions:
  contents: read

# No secrets. No push. No deploy. By design.
env:
  # Monorepo scoping. The server rewrites these two quoted literals from
  # RepoSettings.working_dir / RepoSettings.test_command before pushing the
  # workflow to the mirror (see render_workflow_content). The defaults below
  # mean "repo root" and "language-default test command".
  # tests/test_sandbox_lang_packs.py asserts every template keeps both markers,
  # so template drift fails CI instead of silently ignoring a user's scope.
  HAUNTER_WORKING_DIR: "."
  HAUNTER_TEST_COMMAND: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Caching is off on purpose: the mirror is a priority-truncated seed
          # (settings.seed_max_files), so a module with no dependencies may
          # legitimately have no go.sum, and setup-go's cache step fails the
          # whole job when its dependency file cannot be resolved.
          cache: false

      - name: Install dependencies
        run: |
          cd "${HAUNTER_WORKING_DIR:-.}"
          if [ -f go.mod ]; then
            go mod download
          else
            echo "::warning::no go.mod under ${HAUNTER_WORKING_DIR:-.} — skipping module download"
          fi

      - name: Vet (best-effort)
        run: |
          cd "${HAUNTER_WORKING_DIR:-.}"
          go vet ./... || echo "::warning::go vet found issues"
        continue-on-error: true

      - name: Run tests
        run: |
          # A missing HAUNTER_WORKING_DIR aborts here: the runner invokes bash
          # with `-e`, so a failing `cd` fails the step instead of testing root.
          cd "${HAUNTER_WORKING_DIR:-.}"
          if [ -n "${HAUNTER_TEST_COMMAND}" ]; then
            echo "::notice::running RepoSettings.test_command"
            eval "${HAUNTER_TEST_COMMAND}"
            exit $?
          fi
          go test ./... -count=1

      - name: Build (best-effort)
        run: |
          cd "${HAUNTER_WORKING_DIR:-.}"
          go build ./... || echo "::warning::go build found issues"
        continue-on-error: true