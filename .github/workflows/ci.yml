name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  POSTGRES_VERSION: "16"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint (ruff) + migration check + pytest
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + migrations + 787 tests)
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install runtime deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install dev deps (ruff)
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Verify Python syntax
        working-directory: backend
        run: python -m compileall -q app

      - name: Start Postgres with SSL
        run: |
          docker run -d --name haunter-pg-ssl \
            -p 5432:5432 \
            -e POSTGRES_USER=haunter_test \
            -e POSTGRES_PASSWORD=haunter_test \
            -e POSTGRES_DB=haunter_test \
            postgres:16

          until docker exec haunter-pg-ssl pg_isready -U haunter_test; do
            echo "Waiting for postgres..."
            sleep 1
          done

          docker exec haunter-pg-ssl bash -c "
            apt-get update -qq && apt-get install -yqq openssl >/dev/null
            mkdir -p /var/lib/postgresql/certs
            openssl req -new -x509 -days 365 -nodes \
              -out /var/lib/postgresql/certs/server.crt \
              -keyout /var/lib/postgresql/certs/server.key \
              -subj '/CN=localhost' \
              -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' 2>/dev/null
            chmod 600 /var/lib/postgresql/certs/server.key
            chown postgres:postgres /var/lib/postgresql/certs/server.key /var/lib/postgresql/certs/server.crt
          "

          docker exec haunter-pg-ssl su - postgres -c "
            psql -U haunter_test -d haunter_test -c \"
              ALTER SYSTEM SET ssl = 'on';
              ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/certs/server.crt';
              ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/certs/server.key';
              SELECT pg_reload_conf();
            \"
          "

          docker cp haunter-pg-ssl:/var/lib/postgresql/certs/server.crt /usr/local/share/ca-certificates/haunter.crt
          sudo update-ca-certificates
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Apply Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://haunter_test:haunter_test@localhost:5432/haunter_test?sslmode=require
          DATABASE_URL_UNPOOLED: postgresql://haunter_test:haunter_test@localhost:5432/haunter_test?sslmode=require
        run: alembic upgrade head

      - name: Verify Alembic downgrades + re-upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://haunter_test:haunter_test@localhost:5432/haunter_test?sslmode=require
          DATABASE_URL_UNPOOLED: postgresql://haunter_test:haunter_test@localhost:5432/haunter_test?sslmode=require
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Generate test Fernet key
        id: fernet
        working-directory: backend
        run: |
          python -c "from cryptography.fernet import Fernet; print('key=' + Fernet.generate_key().decode())" >> "$GITHUB_OUTPUT"

      - name: Run backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://haunter_test:haunter_test@localhost:5432/haunter_test?sslmode=require
          DATABASE_URL: postgresql+asyncpg://haunter_prod:haunter_prod@ep-prod.neon.tech:5432/haunter_prod?sslmode=require
          DATABASE_URL_UNPOOLED: postgresql://haunter_prod:haunter_prod@ep-prod.neon.tech:5432/haunter_prod?sslmode=require
          GITHUB_CLIENT_ID: ci_test_client_id
          GITHUB_CLIENT_SECRET: ci_test_client_secret
          CALLBACK_URL: http://localhost:8787/auth/callback
          SESSION_SECRET_KEY: ci_test_session_secret_key_replace_in_prod
          GITHUB_WEBHOOK_SECRET: ci_test_webhook_secret
          FRONTEND_URL: http://localhost:3000
          TOKEN_ENCRYPTION_KEY: ${{ steps.fernet.outputs.key }}
          OPENCODE_ZEN_API_KEY: ci_test_zen_api_key
        run: |
          pytest -v --tb=short --maxfail=10
        timeout-minutes: 30

  # ---------------------------------------------------------------------------
  # Frontend: lint (eslint) + tsc + vitest + next build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + tsc + 219 tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        env:
          # Dummy URL — build only renders, doesn't call the API.
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
