# Ruff config — modern Python linter (replaces flake8 + isort + pyupgrade + more).
# Docs: https://docs.astral.sh/ruff/

# Match the Python versions the project actually supports (Lambda runtime = 3.11+).
target-version = "py311"

# Don't lint the autogenerated venv.
extend-exclude = [".venv", "alembic/versions"]

[lint]
# Sensible default rule set: pycodestyle (E/W), pyflakes (F), bugbear (B),
# comprehensions (C4) — avoiding noisy style rules (UP, I, SIM, PTH, S) that
# fight existing codebase conventions.
select = ["E", "W", "F", "B", "C4"]
ignore = [
    "E501",   # line-too-long — let formatter / PR review handle this
    "B008",   # function call in default argument — common in FastAPI Depends()
    "B904",   # raise ... from err — FastAPI convention raises HTTPException directly
]

[lint.per-file-ignores]
# Tests can use assert freely, may have long lines, may import unused for fixtures.
"tests/**" = ["F401", "F841", "B007", "B017", "F811", "E402", "F541"]

[format]
# Match Black's defaults so we don't fight other formatters.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
